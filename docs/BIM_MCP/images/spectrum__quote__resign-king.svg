<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Resigned king quote backdrop</title>
  <desc id="desc">A quiet quote backdrop with a small king mark and line.</desc>
  <style>
    .bg{fill:#0a0a0a}
    text{font-family:'Noto Sans TC','Helvetica Neue',Inter,sans-serif}
    .ttl{fill:#fff;font-weight:800}
    .sub{fill:rgba(255,255,255,.5)}
    .lbl{fill:rgba(255,255,255,.82)}
    .muted{fill:rgba(255,255,255,.45)}
.up,.fade,.pop{opacity:1}
    .draw{stroke-dasharray:none;stroke-dashoffset:0}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
  <rect class="bg" x="0" y="0" width="1600" height="600"/>

  <circle class="pop" style="animation-delay:.2s" cx="800" cy="245" r="72" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.14)" stroke-width="3"/>
  <circle class="pop pulse" style="animation-delay:.55s" cx="800" cy="245" r="8" fill="#60a5fa"/>
  <text class="up" style="animation-delay:.4s" x="800" y="270" fill="#fff" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="62" font-weight="700">K</text>
  <path class="draw" style="animation-delay:.7s" d="M520 380h560" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-linecap="round"/>
</svg>
